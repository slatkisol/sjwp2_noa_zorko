<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
      <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: grey;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            margin: 0;
        }

        .game {
            background: rgba(0, 0, 0, 0.25);
            padding: 30px 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 100%;
        }

        h2 {
            margin: 10px 0;
        }
        .prvi{
            margin: 20px;
            border: 5px solid black;
             padding: 20px;
               border-radius:15px ;
        }
           .drugi{
            margin: 20px;
            border: 5px solid black;
            border-radius:15px ;
            padding: 20px;
        }

        .buttons {
            margin: 20px 0;
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: #fff;
            color: #333;
            transition: transform 0.2s, background 0.2s;
        }

        button:hover {
            background: #f1f1f1;
            transform: translateY(-2px);
        }

        #odabran {
            color: #ffd369;
            min-height: 24px;
        }

        #pobjednik {
            font-size: 22px;
            font-weight: bold;
            min-height: 28px;
        }
    </style>
</head>
<body>

    <div>
        <h2>Kamen-škare-papir</h2>
        <button id="kamen">Kamen</button>
        <button id="škare">Škare</button>
        <button id="papir">Papir</button>
        <div class="prvi">

    
        <h2>Odabran je:</h2>
        <h2 id="odabran"></h2>
           </div>

           <div class="drugi">

          
        <h2>Rezultat:</h2>
        <h2 id="pobjednik"></h2>
         </div>


    </div>
    <script src="index2.js"></script>
    
</body>
</html>
