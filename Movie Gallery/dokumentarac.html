<meta charset="UTF-8">

<style>
body {
  margin: 0;
  padding: 0;
}

h2, p {
  margin: 10px;
}

ul {
  list-style-type: none;
  margin: 0;
  padding: 0px;
  overflow: hidden;
  background-color: #333333;
}

ul li {
  float: left;
}

.naslov{
  margin-left:40%;
}

.lijevo{
  margin-left:150px;
}

ul li a {
  display: block;
  color: white;
  text-align: center;
  padding: 20px 22px;
  margin-left:40px;
  margin-right:40px;
  text-decoration: none;
  width:120px;
  font-size:20px;
}

ul li a:hover {
  background-color:#111111;
}



.galerija{
  display:grid;
  grid-template-columns: repeat(5, 1fr);
  gap:20px;
  padding:40px;
}

.slika:hover{
  transition: transform 0.3s ease;
   transform: scale(1.1);
}

#modal1 {
  display: none;
  position: fixed;
  z-index: 1000;
  left: 0;
  top: -100px;
  width: 100%;
  height: 100%;
  background-color: rgba(0,0,0,0.7);
    animation: fadeIn 0.3s;
}

#modal1 .sadrzaj {
background: white;
  margin: 10% auto;
  padding: 20px;
  width: 600px;
  border-radius: 10px;

  display: flex;         
  align-items: center;   
  gap: 20px;              

  animation: zoomIn 0.3s;
  
}

.tekst {
  display: flex;
  flex-direction: column;
  justify-content: center;
}
#modalText {
  text-align: left;
  font-size: 22px;
  font-weight: bold;
}
@keyframes fadeIn {
  from {opacity: 0;}
  to {opacity: 1;}
}

@keyframes zoomIn {
  from {
    transform: scale(0.7);
    opacity: 0;
  }
  to {
    transform: scale(1);
    opacity: 1;
  }
}
.film{
  text-align:center;
}
#modal1 .sadrzaj {
  position: relative;
}
.naslov{
    margin-top: 30px;
    margin-left: 200px;
    font-size: 30px;

}
.prvi {
  position: absolute;
  top: 10px;
  right: 15px;
  font-size: 28px;
  font-weight: bold;
  color: #333;
  cursor: pointer;
  transition: 0.3s;
}
.prvi:hover {
  color: red;
  transform: scale(1.2);
}
.film img{
  width:100%;
  border-radius:8px;
}

.film p{
  font-weight:bold;
}

</style>
</head>
